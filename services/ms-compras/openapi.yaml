openapi: 3.0.3
info:
  title: ms-compras — Distribuidora El Montañero
  version: 1.0.0
  description: |
    Órdenes de compra, recepción total o parcial y devoluciones a proveedor (RF06, RF13).

    Las rutas son **internas**: el API Gateway las publica con el prefijo `/api`
    (por ejemplo `GET /api/ordenes-compra`), valida el token y los roles, y agrega las cabeceras
    `X-User-Id`, `X-User-Rol`, `X-User-Bodega` y `X-Request-Id` (Entrega 2, sección 2.2).
    El operador de bodega solo puede recibir y devolver en la bodega que tiene asignada.
servers:
  - url: http://localhost:3000
    description: Servicio directo (sin Gateway)
tags:
  - name: Órdenes de compra
  - name: Recepciones
  - name: Devoluciones a proveedor
  - name: Sistema

components:
  parameters:
    IdOrden:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    UserId:
      name: X-User-Id
      in: header
      description: Usuario verificado por el Gateway.
      schema: { type: integer }
    UserRol:
      name: X-User-Rol
      in: header
      schema: { type: string, enum: [ADMINISTRADOR, OPERADOR_BODEGA, VENDEDOR, CONTADOR] }
    UserBodega:
      name: X-User-Bodega
      in: header
      description: Bodega del operador de bodega.
      schema: { type: integer }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única de la operación. Repetir la petición con la misma clave devuelve la respuesta original sin repetir la operación (RNF17).
      schema: { type: string, maxLength: 80 }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: por_pagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FechaDesde:
      name: fecha_desde
      in: query
      schema: { type: string, format: date }
    FechaHasta:
      name: fecha_hasta
      in: query
      schema: { type: string, format: date }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string, example: TRANSICION_INVALIDA }
            mensaje: { type: string }
            detalles:
              type: array
              items: { type: object }
    Meta:
      type: object
      properties:
        pagina: { type: integer }
        por_pagina: { type: integer }
        total: { type: integer }
    EstadoOrden:
      type: string
      enum: [CREADA, ENVIADA, RECIBIDA_PARCIAL, RECIBIDA, ANULADA]
    LineaEntrada:
      type: object
      required: [id_producto, cantidad_pedida, precio_unitario]
      properties:
        id_producto: { type: integer, description: Referencia a ms-catalogo }
        cantidad_pedida: { type: integer, minimum: 1 }
        precio_unitario: { type: number, minimum: 0, description: Pesos colombianos }
    OrdenEntrada:
      type: object
      required: [id_proveedor, id_bodega_destino, fecha_esperada, detalles]
      properties:
        id_proveedor: { type: integer, description: Referencia a ms-proveedores }
        id_bodega_destino: { type: integer, description: Referencia a ms-inventario }
        fecha_esperada: { type: string, format: date }
        detalles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineaEntrada' }
    Detalle:
      type: object
      properties:
        id_detalle: { type: integer }
        id_producto: { type: integer }
        cantidad_pedida: { type: integer }
        cantidad_recibida: { type: integer }
        precio_unitario: { type: number }
        subtotal: { type: number }
    Recepcion:
      type: object
      properties:
        id_recepcion: { type: integer }
        id_detalle: { type: integer }
        id_producto: { type: integer }
        cantidad: { type: integer }
        codigo_lote: { type: string, nullable: true }
        fecha_vencimiento: { type: string, format: date, nullable: true }
        fecha: { type: string, format: date-time }
        id_usuario: { type: integer }
        id_movimiento: { type: integer, description: Movimiento ENTRADA_COMPRA creado en ms-inventario }
    Orden:
      type: object
      properties:
        id_orden: { type: integer }
        numero: { type: string, example: OC-0001 }
        estado: { $ref: '#/components/schemas/EstadoOrden' }
        id_proveedor: { type: integer }
        id_bodega_destino: { type: integer }
        id_usuario: { type: integer }
        fecha_creacion: { type: string, format: date-time }
        fecha_esperada: { type: string, format: date }
        total: { type: number }
    OrdenCompleta:
      allOf:
        - $ref: '#/components/schemas/Orden'
        - type: object
          properties:
            detalles:
              type: array
              items: { $ref: '#/components/schemas/Detalle' }
            recepciones:
              type: array
              items: { $ref: '#/components/schemas/Recepcion' }
    Devolucion:
      type: object
      properties:
        id_devolucion: { type: integer }
        id_orden: { type: integer, nullable: true }
        id_proveedor: { type: integer }
        id_producto: { type: integer }
        id_bodega: { type: integer }
        id_lote: { type: integer, nullable: true }
        cantidad: { type: integer }
        motivo: { type: string }
        fecha: { type: string, format: date-time }
        id_usuario: { type: integer }
        id_movimiento: { type: integer, description: Movimiento DEVOLUCION_PROVEEDOR creado en ms-inventario }

  responses:
    NoEncontrado:
      description: No existe
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Invalido:
      description: Datos no válidos
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflicto:
      description: Conflicto (estado no permitido o stock insuficiente)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    SinPermiso:
      description: El operador de bodega intenta operar sobre otra bodega (BODEGA_AJENA)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NoDisponible:
      description: ms-inventario no responde (SERVICIO_NO_DISPONIBLE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /ordenes-compra:
    get:
      tags: [Órdenes de compra]
      summary: Listar órdenes de compra
      description: 'Roles: ADMINISTRADOR, OPERADOR_BODEGA. También la usa ms-reportes (llamada 6).'
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoOrden' } }
        - { name: id_proveedor, in: query, schema: { type: integer } }
        - { name: id_bodega_destino, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Orden' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '422': { $ref: '#/components/responses/Invalido' }
    post:
      tags: [Órdenes de compra]
      summary: Crear una orden de compra (RF06)
      description: 'Rol: ADMINISTRADOR. La orden queda CREADA con número consecutivo y total calculado.'
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRol'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrdenEntrada' } } }
      responses:
        '201':
          description: Orden creada
          content: { application/json: { schema: { $ref: '#/components/schemas/OrdenCompleta' } } }
        '422': { $ref: '#/components/responses/Invalido' }

  /ordenes-compra/{id}:
    parameters:
      - $ref: '#/components/parameters/IdOrden'
    get:
      tags: [Órdenes de compra]
      summary: Consultar una orden con sus líneas y recepciones
      responses:
        '200':
          description: Orden
          content: { application/json: { schema: { $ref: '#/components/schemas/OrdenCompleta' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Órdenes de compra]
      summary: Editar una orden (solo en estado CREADA)
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRol'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrdenEntrada' } } }
      responses:
        '200':
          description: Orden actualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/OrdenCompleta' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Invalido' }

  /ordenes-compra/{id}/estado:
    patch:
      tags: [Órdenes de compra]
      summary: Enviar o anular una orden
      description: |
        CREADA → ENVIADA o ANULADA; ENVIADA → ANULADA si todavía no tiene recepciones.
        RECIBIDA_PARCIAL y RECIBIDA se asignan solos con cada recepción.
      parameters:
        - $ref: '#/components/parameters/IdOrden'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [ENVIADA, ANULADA] }
      responses:
        '200':
          description: Orden con su nuevo estado
          content: { application/json: { schema: { $ref: '#/components/schemas/OrdenCompleta' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Invalido' }

  /ordenes-compra/{id}/recepciones:
    parameters:
      - $ref: '#/components/parameters/IdOrden'
    get:
      tags: [Recepciones]
      summary: Listar las recepciones de una orden
      responses:
        '200':
          description: Recepciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Recepcion' } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Recepciones]
      summary: Recibir mercancía total o parcial (RF06)
      description: |
        Por cada línea registra un movimiento ENTRADA_COMPRA en ms-inventario (llamada 2) y guarda la
        recepción cuando inventario responde. La orden pasa a RECIBIDA_PARCIAL o RECIBIDA. Si una línea
        falla, la respuesta indica cuáles faltan; reintentar con la misma Idempotency-Key no duplica las
        ya registradas. Al terminar avisa a ms-notificaciones (llamada 4).
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRol'
        - $ref: '#/components/parameters/UserBodega'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineas]
              properties:
                lineas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id_detalle, cantidad]
                    properties:
                      id_detalle: { type: integer }
                      cantidad: { type: integer, minimum: 1 }
                      codigo_lote: { type: string, description: Va junto con fecha_vencimiento }
                      fecha_vencimiento: { type: string, format: date }
      responses:
        '201':
          description: Recepciones registradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_orden: { type: integer }
                  numero: { type: string }
                  estado: { $ref: '#/components/schemas/EstadoOrden' }
                  recepciones: { type: array, items: { $ref: '#/components/schemas/Recepcion' } }
        '400': { description: Falta la cabecera Idempotency-Key }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Invalido' }
        '503': { $ref: '#/components/responses/NoDisponible' }

  /devoluciones-proveedor:
    get:
      tags: [Devoluciones a proveedor]
      summary: Listar devoluciones a proveedor
      parameters:
        - { name: id_proveedor, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/FechaDesde'
        - $ref: '#/components/parameters/FechaHasta'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  datos: { type: array, items: { $ref: '#/components/schemas/Devolucion' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Devoluciones a proveedor]
      summary: Devolver mercancía a un proveedor (RF13)
      description: Registra un movimiento DEVOLUCION_PROVEEDOR en ms-inventario y guarda la devolución. La orden es opcional.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/UserRol'
        - $ref: '#/components/parameters/UserBodega'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_proveedor, id_producto, id_bodega, cantidad, motivo]
              properties:
                id_proveedor: { type: integer }
                id_producto: { type: integer }
                id_bodega: { type: integer }
                cantidad: { type: integer, minimum: 1 }
                motivo: { type: string, maxLength: 255 }
                id_orden: { type: integer }
                id_lote: { type: integer }
      responses:
        '201':
          description: Devolución registrada
          content: { application/json: { schema: { $ref: '#/components/schemas/Devolucion' } } }
        '400': { description: Falta la cabecera Idempotency-Key }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Invalido' }
        '503': { $ref: '#/components/responses/NoDisponible' }

  /health:
    get:
      tags: [Sistema]
      summary: Estado del servicio, de su base de datos y de los cortacircuitos
      responses:
        '200': { description: El servicio funciona }
        '503': { description: Sin conexión a la base de datos }
