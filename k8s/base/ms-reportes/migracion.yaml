# Aplica las migraciones de ms-reportes una sola vez por despliegue y termina (con varias copias, que arranquen todas a la vez no debe
# migrar varias veces). Los Deployments no esperan a esta Job: hasta que termine, ms-reportes responde, pero sus rutas con base de datos fallan.
#   kubectl -n gestor-inventario wait --for=condition=complete job/ms-reportes-migrar --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: ms-reportes-migrar
  labels:
    app.kubernetes.io/name: ms-reportes-migrar
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-reportes-migrar
        db: db-ms-reportes
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: esperar-base-de-datos
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db-ms-reportes 5432; do echo esperando db-ms-reportes; sleep 2; done"]
          securityContext:
            # busybox corre como root por defecto y el Pod exige runAsNonRoot: sin un UID numérico el kubelet lo rechaza.
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: migrar
          image: ms-reportes:latest
          imagePullPolicy: IfNotPresent
          command: ["flask", "db", "upgrade"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DB_HOST
              value: "db-ms-reportes"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-ms-reportes
                  key: nombre
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-ms-reportes
                  key: usuario
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-ms-reportes
                  key: clave
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
