# Aplica las migraciones de api-gateway una sola vez por despliegue y termina (con varias copias, que arranquen todas a la vez no debe
# migrar varias veces). Los Deployments no esperan a esta Job: hasta que termine, api-gateway responde, pero sus rutas con base de datos fallan.
#   kubectl -n gestor-inventario wait --for=condition=complete job/api-gateway-migrar --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: api-gateway-migrar
  labels:
    app.kubernetes.io/name: api-gateway-migrar
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway-migrar
        db: db-api-gateway
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: esperar-base-de-datos
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db-api-gateway 3306; do echo esperando db-api-gateway; sleep 2; done"]
          securityContext:
            # busybox corre como root por defecto y el Pod exige runAsNonRoot: sin un UID numérico el kubelet lo rechaza.
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: migrar
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: api-gateway-app
                  key: APP_KEY
            - name: DB_HOST
              value: "db-api-gateway"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-api-gateway
                  key: nombre
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-api-gateway
                  key: usuario
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-api-gateway
                  key: clave
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
