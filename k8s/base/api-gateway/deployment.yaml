apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  # 1 a 4 copias según el procesador (k8s/hpa, RNF05): el HPA manda sobre este valor.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        db: db-api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: api-gateway-app
                  key: APP_KEY
            - name: DB_HOST
              value: "db-api-gateway"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-api-gateway
                  key: nombre
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-api-gateway
                  key: usuario
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-api-gateway
                  key: clave
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-app
                  key: JWT_SECRET
            - name: TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: api-gateway-config
                  key: TRUSTED_PROXIES
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
