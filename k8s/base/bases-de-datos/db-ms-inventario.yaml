# Base de datos propia de ms-inventario (RNF02): solo ella la usa y solo se llega desde su servicio (k8s/base/politicas-de-red.yaml).
# Las credenciales vienen del Secret «db-ms-inventario» (ver secretos.example.yaml). Datos en un volumen persistente de 1 GiB: para producción,
# ajuste storageClassName y el tamaño.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-ms-inventario
  labels:
    app.kubernetes.io/name: db-ms-inventario
spec:
  serviceName: db-ms-inventario
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-ms-inventario
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-ms-inventario
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: bd
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: db-ms-inventario, key: nombre}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: db-ms-inventario, key: usuario}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: db-ms-inventario, key: clave}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
# Service sin IP propia (headless): el StatefulSet se llama como en Docker Compose (db-ms-inventario) y las aplicaciones lo usan en DB_HOST.
apiVersion: v1
kind: Service
metadata:
  name: db-ms-inventario
  labels:
    app.kubernetes.io/name: db-ms-inventario
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: db-ms-inventario
  ports:
    - name: bd
      port: 5432
      targetPort: bd
