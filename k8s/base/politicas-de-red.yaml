# RNF09: solo el API Gateway y el cliente web reciben tráfico de fuera del clúster. Los microservicios confían en las cabeceras
# X-User-* que pone el Gateway y no tienen autenticación propia: lo que impide que otro pod las falsifique es esta red cerrada.
# Requiere un complemento de red que haga cumplir NetworkPolicy (Calico, Cilium...); sin él, estas reglas se aceptan pero no se aplican.
#
# 1) Todo lo que entra queda denegado por defecto.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-entrada-por-defecto
spec:
  podSelector: {}
  policyTypes: [Ingress]

---
# 2) Desde fuera, solo el cliente web y el Gateway, y solo desde el controlador de Ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-ingress-a-web-client
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-client
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx   # el espacio de nombres de su controlador de Ingress
      ports:
        - port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-ingress-a-api-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx   # el espacio de nombres de su controlador de Ingress
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [web-client]}
      ports:
        - port: 8000

---
# ms-inventario: solo lo llaman api-gateway, ms-compras, ms-notificaciones, ms-reportes (Tabla 2 de la Entrega 2 y el Gateway).
apiVersion: networking.k8s.io/v1
