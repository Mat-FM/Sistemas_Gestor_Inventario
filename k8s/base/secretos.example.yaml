# PLANTILLA de los Secret que el sistema necesita. NO está en kustomization.yaml a propósito: no se aplica tal cual, porque
# «CAMBIAR» no es una contraseña. Cree cada Secret con valores reales (ver k8s/README.md) y no suba esos valores al repositorio.
#
# Generar los valores:
#   contraseña de una base de datos :  openssl rand -base64 24
#   JWT_SECRET (mínimo 32 caracteres):  openssl rand -base64 48
#   APP_KEY de Laravel                 :  echo "base64:$(openssl rand -base64 32)"
# Las APP_KEY y el JWT_SECRET los comparten todas las copias de su servicio: se generan UNA vez y se guardan.
#
# Credenciales de cada base de datos: las usan la propia base y su servicio (RNF02).
---
apiVersion: v1
kind: Secret
metadata:
  name: db-api-gateway
  namespace: gestor-inventario
type: Opaque
stringData:
  nombre: gateway_db
  usuario: gateway
  clave: CAMBIAR
---
